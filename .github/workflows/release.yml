name: release

# Builds the Windows executable and attaches it to the release, so the binary
# on GitHub is always produced from the tagged source rather than from whatever
# happened to be on a laptop.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e ".[audio,speech,dev]"
          pip install pyinstaller

      - name: Test before packaging
        run: pytest -q

      - name: Build
        working-directory: packaging
        run: pyinstaller echolock.spec --noconfirm --distpath ../dist --workpath ../build

      - name: Check the executable runs
        run: ./dist/EchoLock/EchoLock.exe --version

      # A one-folder build cannot be attached to a release as-is, so it goes up
      # as a single zip. That is also the smaller download: compressed, it comes
      # in below the old single-file executable.
      - name: Package
        run: Compress-Archive -Path dist/EchoLock -DestinationPath dist/EchoLock-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: EchoLock-windows
          path: dist/EchoLock-windows.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/EchoLock-windows.zip
